<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Make My Inventory</title>
<style>
  body { margin: 0; background: #11151c; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
  .top { background: #1f3d10; border-bottom: 5px solid #0a1408; padding: 13px 22px; display: flex;
         align-items: center; gap: 18px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 21px; }
  .top p { margin: 0; font-size: 16px; color: #e7f3dd; }
  .top b { color: #ffd54f; font-size: 19px; }
  .key { display: inline-block; background: #6abe30; border: 2px solid #0a1408; color: #16310a;
         padding: 2px 9px; font-family: monospace; font-weight: bold; }
  .bar { background: #161b24; padding: 12px 22px; border-bottom: 2px solid #000;
         display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .run { font-family: monospace; cursor: pointer; background: #6abe30; color: #16310a;
         border: 4px solid #0a1408; padding: 13px 34px; font-size: 19px; font-weight: bold;
         box-shadow: 4px 4px 0 rgba(0,0,0,.45); }
  .run:hover { background: #7ed957; }
  .reset { font-family: monospace; cursor: pointer; background: #3a2a1a; color: #fff;
           border: 4px solid #000; padding: 13px 16px; font-size: 14px; }
  .wrap { display: flex; gap: 0; height: calc(100vh - 128px); }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane .lbl { background: #0d1118; color: #8fb36e; font-family: monospace; font-size: 13px;
               padding: 7px 16px; border-bottom: 2px solid #000; }
  #code { flex: 1; width: 100%; box-sizing: border-box; border: 0; resize: none;
          background: #0d1320; color: #e8f0e0; font-family: 'Consolas', monospace;
          font-size: 14.5px; line-height: 1.55; padding: 14px 16px; outline: none; }
  #out { flex: 1; width: 100%; border: 0; background: #fff; }
  .divider { width: 5px; background: #0a1408; }
</style>
</head>
<body>

  <div class="top">
    <h1>&#9935; Make your OWN inventory!</h1>
    <p>Put your own things in the <b>&#9999;&#65039;</b> list, then press <span class="key">&#9654; Run</span>. The loop does the rest.</p>
  </div>

  <div class="bar">
    <button class="run" onclick="run()">&#9654; Run my inventory</button>
    <button class="reset" onclick="resetCode()">&#8635; Start again</button>
  </div>

  <div class="wrap">
    <div class="pane">
      <div class="lbl">your code &nbsp;&mdash;&nbsp; change the &#9999;&#65039; list</div>
      <textarea id="code" spellcheck="false"><!DOCTYPE html>
<html>
<head>
<title>My Inventory</title>

<!-- The CSS below is DONE for you. Don't touch it. -->
<style>
  body { margin:0; background:#11151c; color:#fff; font-family:'Segoe UI',system-ui,sans-serif; text-align:center; }
  header { background:#1f3d10; border-bottom:5px solid #0a1408; padding:20px; }
  h1 { margin:0; font-size:34px; }
  .panel { max-width:640px; margin:28px auto; background:#2b2b2b; border:5px solid #0a0a0a; border-radius:6px; padding:20px; }
  .panel-h { color:#ffd54f; font-weight:bold; text-align:left; margin-bottom:14px; text-transform:uppercase; letter-spacing:2px; }
  #bag { display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
  .slot { width:124px; height:62px; display:flex; align-items:center; justify-content:center; background:#c7b29a; border:3px solid #5d4037; border-radius:4px; color:#3e2723; font-weight:700; font-size:15px; }
  .count { color:#9fe06a; font-weight:bold; margin-top:16px; }
</style>
</head>
<body>

  <header>
    <h1>&#9935; MY INVENTORY</h1>   <!-- ✏️ your title -->
  </header>

  <div class="panel">
    <div class="panel-h">★ Hotbar</div>
    <div id="bag"></div>
    <div class="count" id="count"></div>
  </div>

  <script>
    // ✏️ CHANGE THIS LIST to your own things (add as many as you like!)
    let items = ["Sword", "Apple", "Diamond", "Torch", "Map"];

    // The loop below builds a slot for EVERY item. You do NOT change it.
    let bag = "";
    for (let i = 0; i < items.length; i = i + 1) {
      bag = bag + "<span class='slot'>" + items[i] + "</span>";
    }
    document.getElementById("bag").innerHTML = bag;
    document.getElementById("count").innerHTML = items.length + " items, built by ONE loop!";
  </script>
</body>
</html></textarea>
    </div>

    <div class="divider"></div>

    <div class="pane">
      <div class="lbl">your inventory &nbsp;&mdash;&nbsp; press &#9654; Run to update</div>
      <iframe id="out"></iframe>
    </div>
  </div>

  <script>
    var START = document.getElementById("code").value;
    function run() { document.getElementById("out").srcdoc = document.getElementById("code").value; }
    function resetCode() { document.getElementById("code").value = START; run(); }
    run();
  </script>

</body>
</html>
