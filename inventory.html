<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>My Inventory</title>
<style>
  body { margin: 0; background: #12161d; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif;
         text-align: center; padding: 22px 0 28px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: #9fe06a; font-size: 14px; margin-bottom: 18px; font-weight: bold; }

  /* the grey Minecraft GUI panel (built from CSS bevels, not a texture) */
  .mc-window { display: inline-block; background: #c6c6c6; padding: 16px;
               box-shadow: inset 3px 3px 0 #fefefe, inset -3px -3px 0 #8b8b8b, 0 0 0 4px #2b2b2b; }
  .mc-title { text-align: left; color: #3f3f3f; font-weight: bold; font-size: 15px;
              letter-spacing: 1px; margin: 0 2px 10px; }

  /* a 9-wide grid of inventory slots */
  .grid { display: grid; grid-template-columns: repeat(9, 50px); gap: 4px; }
  .slot { position: relative; width: 50px; height: 50px; background: #8b8b8b;
          box-shadow: inset 3px 3px 0 #373737, inset -3px -3px 0 #ffffff; }
  .item { position: absolute; inset: 9px; border-radius: 1px;
          box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.32); }
  .count { position: absolute; right: 4px; bottom: 0; color: #fff; font-family: 'Consolas', monospace;
           font-weight: bold; font-size: 15px; text-shadow: 2px 2px 0 #3f3f3f; }

  /* item colours = simple original blocks (NOT Mojang textures) */
  .diamond  { background: linear-gradient(135deg,#a7f3ec,#2fc7bd); }
  .gold     { background: linear-gradient(135deg,#ffe9a8,#f4b400); }
  .iron     { background: linear-gradient(135deg,#f2f2f2,#b9b9b9); }
  .emerald  { background: linear-gradient(135deg,#7cf0a8,#1f9d57); }
  .lapis    { background: linear-gradient(135deg,#5b7be0,#27409c); }
  .redstone { background: linear-gradient(135deg,#f0604a,#a3160c); }
  .coal     { background: linear-gradient(135deg,#5a5a5a,#1a1a1a); }
  .bone     { background: linear-gradient(135deg,#fbfbe8,#cfcbb0); }
  .bread    { background: linear-gradient(135deg,#dcae5a,#a9701f); }
  .apple    { background: linear-gradient(135deg,#f0584a,#b01a14); }
  .grass    { background: linear-gradient(135deg,#86cf57,#5a9c2e); }
  .dirt     { background: linear-gradient(135deg,#a97c52,#7a5230); }
  .stone    { background: linear-gradient(135deg,#b3b3b3,#7c7c7c); }
  .plank    { background: linear-gradient(135deg,#c19a5b,#90672f); }
  .stick    { background: linear-gradient(135deg,#b0823c,#7a5a25); }

  footer { color: #8aa17c; font-size: 13px; padding-top: 20px; }
</style>
</head>
<body>

  <h1>&#9935; My Inventory</h1>
  <div class="sub">Every slot below was placed by ONE loop.</div>

  <div class="mc-window">
    <div class="mc-title">INVENTORY</div>
    <div id="bag" class="grid"></div>
  </div>

  <footer>15 items, 0 copied lines &mdash; built by one JavaScript loop.</footer>

  <script>
    let blocks = ["diamond", "gold", "iron", "emerald", "lapis", "redstone", "coal", "bone", "bread",
                  "apple", "grass", "dirt", "stone", "plank", "stick"];
    let counts = [12, 57, 33, 9, 64, 48, 26, 9, 64, 3, 30, 64, 26, 22, 5];

    let bag = "";
    for (let i = 0; i < blocks.length; i = i + 1) {
      bag = bag + "<div class='slot'><span class='item " + blocks[i] + "'></span>" +
                  "<span class='count'>" + counts[i] + "</span></div>";
    }
    document.getElementById("bag").innerHTML = bag;
  </script>

</body>
</html>
