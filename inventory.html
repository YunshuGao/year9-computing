<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>My Inventory</title>
<style>
  body { margin: 0; background: #11151c; color: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; }
  header { background: #1f3d10; border-bottom: 5px solid #0a1408; padding: 20px; }
  h1 { margin: 0; font-size: 34px; letter-spacing: 1px; }
  .sub { color: #bfe0a8; font-size: 15px; margin-top: 6px; }
  .panel { max-width: 640px; margin: 28px auto; background: #2b2b2b; border: 5px solid #0a0a0a;
           border-radius: 6px; padding: 20px; box-shadow: 7px 7px 0 rgba(0,0,0,.45); }
  .panel-h { color: #ffd54f; font-weight: bold; font-size: 14px; text-align: left;
             margin-bottom: 14px; text-transform: uppercase; letter-spacing: 2px; }
  #bag { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .slot { width: 124px; height: 62px; display: flex; align-items: center; justify-content: center;
          gap: 6px; background: #c7b29a; border: 3px solid #5d4037; border-radius: 4px;
          color: #3e2723; font-weight: 700; font-size: 15px; }
  .count { color: #9fe06a; font-size: 15px; font-weight: bold; margin-top: 16px; }
  footer { color: #8aa17c; font-size: 13px; padding: 20px; }
</style>
</head>
<body>

  <header>
    <h1>&#9935; MY INVENTORY</h1>
    <div class="sub">Every slot below was placed by ONE loop.</div>
  </header>

  <div class="panel">
    <div class="panel-h">&#9733; Hotbar</div>
    <div id="bag"></div>
    <div class="count" id="count"></div>
  </div>

  <footer>Built with ONE JavaScript loop &mdash; by a Year 9 coder.</footer>

  <script>
    let items = ["⚔️ Sword", "⛏️ Pickaxe", "🔥 Torch",
                 "🍎 Apple", "💎 Diamond", "🏹 Bow",
                 "🗺️ Map", "🍞 Bread", "🛡️ Shield"];
    function fill() {
      let bag = "";
      for (let i = 0; i < items.length; i = i + 1) {
        bag = bag + "<span class='slot'>" + items[i] + "</span>";
      }
      document.getElementById("bag").innerHTML = bag;
      document.getElementById("count").innerHTML =
        items.length + " items &mdash; not from " + items.length + " lines, from ONE loop.";
    }
    fill();
  </script>

</body>
</html>
