<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Make My Game Page</title>
<style>
  body { margin: 0; background: #11151c; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
  .top { background: #1f3d10; border-bottom: 5px solid #0a1408; padding: 13px 22px; display: flex;
         align-items: center; gap: 18px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 21px; }
  .top p { margin: 0; font-size: 16px; color: #e7f3dd; }
  .top b { color: #ffd54f; font-size: 19px; }
  .key { display: inline-block; background: #6abe30; border: 2px solid #0a1408; color: #16310a;
         padding: 2px 9px; font-family: monospace; font-weight: bold; }

  .bar { background: #161b24; padding: 12px 22px; border-bottom: 2px solid #000;
         display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .run { font-family: monospace; cursor: pointer; background: #6abe30; color: #16310a;
         border: 4px solid #0a1408; padding: 13px 34px; font-size: 19px; font-weight: bold;
         box-shadow: 4px 4px 0 rgba(0,0,0,.45); }
  .run:hover { background: #7ed957; }
  .reset { font-family: monospace; cursor: pointer; background: #3a2a1a; color: #fff;
           border: 4px solid #000; padding: 13px 16px; font-size: 14px; }

  .wrap { display: flex; gap: 0; height: calc(100vh - 128px); }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane .lbl { background: #0d1118; color: #8fb36e; font-family: monospace; font-size: 13px;
               padding: 7px 16px; border-bottom: 2px solid #000; }
  #code { flex: 1; width: 100%; box-sizing: border-box; border: 0; resize: none;
          background: #0d1320; color: #e8f0e0; font-family: 'Consolas', monospace;
          font-size: 14.5px; line-height: 1.55; padding: 14px 16px; outline: none; }
  #out { flex: 1; width: 100%; border: 0; background: #fff; }
  .divider { width: 5px; background: #0a1408; }
</style>
</head>
<body>

  <div class="top">
    <h1>&#127918; Make your OWN game page!</h1>
    <p>Type your words next to each <b>&#9999;&#65039;</b>, then press <span class="key">&#9654; Run</span>.</p>
  </div>

  <div class="bar">
    <button class="run" onclick="run()">&#9654; Run my page</button>
    <button class="reset" onclick="resetCode()">&#8635; Start again</button>
  </div>

  <div class="wrap">
    <div class="pane">
      <div class="lbl">your code &nbsp;&mdash;&nbsp; change the &#9999;&#65039; bits</div>
      <textarea id="code" spellcheck="false"><!DOCTYPE html>
<html>
<head>
<title>My Game Page</title>

<!-- The CSS below is DONE for you. Don't touch it. Scroll past </style>. -->
<style>
  body { margin: 0; background-color: #12161d; font-family: monospace; color: #ffffff; text-align: center; }
  nav { background-color: #1f3d10; padding: 14px; border-bottom: 4px solid #0a1408; }
  nav a { color: #ffffff; text-decoration: none; font-weight: bold; font-size: 18px; margin: 0 16px; }
  nav a:hover { color: #ffd54f; }
  header { background-color: #13230d; padding-bottom: 30px; }
  h1 { color: #ffffff; font-size: 58px; margin: 22px 0 8px; }
  h2 { color: #7ed957; font-size: 30px; margin: 38px 0 8px; }
  p { font-size: 17px; }
  button { font-family: monospace; cursor: pointer; background-color: #8a6240; color: #ffffff; border: 4px solid #3a2a1a; padding: 12px 20px; font-weight: bold; font-size: 16px; margin: 5px; }
  button:hover { background-color: #a87a50; }
  table { margin-top: 18px; }
  footer { background-color: #1f3d10; color: #cfe7bf; padding: 20px; margin-top: 36px; font-size: 14px; }
</style>
</head>
<body>

<!-- ========== TYPE YOUR WORDS BELOW. Look for the ✏️ ========== -->

  <nav>
    <a href="#play">Play</a>
    <a href="#mobs">Mobs</a>
    <a href="#stats">Stats</a>
  </nav>

  <header>
    <img src="img/mc-hero.png" alt="My world" style="width:100%; border:6px solid #0a1408">

    <h1>My Game</h1>                       <!-- ✏️ your game name -->

    <p style="font-size:22px">Type your slogan here.</p>   <!-- ✏️ your slogan -->

    <button onclick="play()" style="background-color:#6abe30; color:#16310a; border:5px solid #0a1408; padding:16px 40px; font-size:24px">&#9654; PLAY FREE</button>
  </header>

  <h2>Three ways to play</h2>
  <table align="center">
    <tr>
      <td style="padding:18px 24px; width:230px">
        <img src="img/mob-cube.png" width="76"><br>
        <b style="font-size:20px; color:#7ed957">BUILD</b>      <!-- ✏️ a way to play -->
        <p>What do players do?</p>
      </td>
      <td style="padding:18px 24px; width:230px">
        <img src="img/icon-diamond.png" width="76"><br>
        <b style="font-size:20px; color:#5fe0d6">MINE</b>       <!-- ✏️ a way to play -->
        <p>What do players do?</p>
      </td>
      <td style="padding:18px 24px; width:230px">
        <img src="img/mob-monster.png" width="76"><br>
        <b style="font-size:20px; color:#ff7a7a">SURVIVE</b>    <!-- ✏️ a way to play -->
        <p>What do players do?</p>
      </td>
    </tr>
  </table>

  <h2 id="mobs">Meet the mobs</h2>
  <table align="center">
    <tr>
      <td style="padding:12px"><img src="img/mob-cube.png" width="88"><br>Name 1</td>     <!-- ✏️ name it -->
      <td style="padding:12px"><img src="img/mob-pig.png" width="88"><br>Name 2</td>      <!-- ✏️ name it -->
      <td style="padding:12px"><img src="img/mob-sheep.png" width="88"><br>Name 3</td>    <!-- ✏️ name it -->
      <td style="padding:12px"><img src="img/mob-monster.png" width="88"><br>Name 4</td>  <!-- ✏️ name it -->
    </tr>
  </table>

  <h2 id="play">Try a mini-game</h2>
  <button onclick="mine()">Mine a block</button>
  <button onclick="loot()">Open chest</button>
  <button onclick="roll()">Roll the dice</button>
  <h2 id="out" style="background-color:#6abe30; color:#ffffff; border:4px solid #1f3d10; max-width:560px; margin:16px auto; padding:12px">Press a button to play!</h2>

  <footer>Made by your name.</footer>      <!-- ✏️ your name -->

  <script>
    function play() { document.getElementById("out").innerHTML = "Loading your world..."; }
    function mine() { document.getElementById("out").innerHTML = "You mined a block!"; }
    function loot() {
      let blocks = ["Diamond", "Gold", "Emerald"];   // ✏️ your treasure words
      let i = Math.floor(Math.random() * blocks.length);
      document.getElementById("out").innerHTML = "You found: " + blocks[i] + "!";
    }
    function roll() {
      let n = Math.floor(Math.random() * 6) + 1;
      document.getElementById("out").innerHTML = "You rolled a " + n + "!";
    }
  </script>
</body>
</html></textarea>
    </div>

    <div class="divider"></div>

    <div class="pane">
      <div class="lbl">your page &nbsp;&mdash;&nbsp; press &#9654; Run to update</div>
      <iframe id="out"></iframe>
    </div>
  </div>

  <script>
    var START = document.getElementById("code").value;
    function run() { document.getElementById("out").srcdoc = document.getElementById("code").value; }
    function resetCode() { document.getElementById("code").value = START; run(); }
    run();
  </script>

</body>
</html>
